name: release

# Triggered by a `v*` tag (e.g. v0.1.0) or manually. Builds the cdylib on each
# native platform, bundles ALL platform libs into a single universal
# `py3-none-any` wheel (the Python wrapper selects the right lib at runtime),
# publishes to PyPI and crates.io, and commits the platform libs into the Go
# module so `go get` ships them. Needs secrets: PYPI_API_TOKEN,
# CARGO_REGISTRY_TOKEN.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  libs:
    name: libs (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-latest }
          - { name: linux-arm64, os: ubuntu-24.04-arm }
          - { name: windows-x86_64, os: windows-latest }
          - { name: macos-arm64, os: macos-14 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build bundled cdylib (host platform)
        shell: bash
        run: |
          rm -rf bindings/python/temari/lib bindings/go/lib
          python scripts/build_platform_libs.py
      - name: Upload platform libs
        uses: actions/upload-artifact@v4
        with:
          name: lib-${{ matrix.name }}
          path: |
            bindings/go/lib
            bindings/python/temari/lib
          if-no-files-found: error

  wheels:
    name: build universal wheel
    needs: libs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          path: libs
          pattern: lib-*
          merge-multiple: true
      - name: Assemble all platform libs into the Python package
        run: |
          rm -rf bindings/python/temari/lib
          mkdir -p bindings/python/temari/lib
          cp -r libs/bindings/python/temari/lib/* bindings/python/temari/lib/
          find bindings/python/temari/lib -type f
      - name: Build sdist + universal wheel
        working-directory: bindings/python
        run: |
          python -m pip install --quiet build
          python -m build
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pypi-dist
          path: bindings/python/dist/*

  pypi:
    name: publish to PyPI
    needs: wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          name: pypi-dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  cargo:
    name: publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish

  go-bundle:
    name: bundle libs into Go module
    needs: libs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: libs
          pattern: lib-*
          merge-multiple: true
      - name: Assemble bindings/go/lib
        run: |
          rm -rf bindings/go/lib
          mkdir -p bindings/go/lib
          cp -r libs/bindings/go/lib/* bindings/go/lib/
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bindings/go/lib
          if git diff --cached --quiet; then
            echo "no lib changes"
          else
            git commit -m "chore: bundle platform cdylibs into Go module [skip ci]"
            git push origin master
          fi