name: release

# Triggered by a `v*` tag (e.g. v0.1.0) or manually. Builds the cdylib on each
# native platform, bundles it into per-platform Python wheels, publishes to
# PyPI and crates.io, and commits the platform libs into the Go module so
# `go get` ships them. Needs secrets: PYPI_API_TOKEN, CARGO_REGISTRY_TOKEN.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-latest, arch: x86_64 }
          - { name: linux-arm64, os: ubuntu-24.04-arm, arch: aarch64 }
          - { name: windows-x86_64, os: windows-latest, arch: x86_64 }
          - { name: macos-arm64, os: macos-14, arch: arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build bundled cdylib (host platform)
        shell: bash
        run: |
          rm -rf bindings/python/temari/lib bindings/go/lib
          python scripts/build_platform_libs.py
      - name: Upload platform libs (for Go bundling)
        uses: actions/upload-artifact@v4
        with:
          name: lib-${{ matrix.name }}
          path: |
            bindings/go/lib
            bindings/python/temari/lib
          if-no-files-found: error
      - name: Build wheel (cibuildwheel)
        uses: pypa/cibuildwheel@v2.21.3
        with:
          package-dir: bindings/python
        env:
          CIBW_BUILD: "cp312-*"
          CIBW_ARCHS: "${{ matrix.arch }}"
          CIBW_BEFORE_BUILD: "python ../../scripts/build_platform_libs.py"
      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.name }}
          path: bindings/python/wheelhouse/*.whl

  pypi:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: wheel-*
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  cargo:
    name: publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish

  go-bundle:
    name: bundle libs into Go module
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: libs
          pattern: lib-*
          merge-multiple: true
      - name: Assemble bindings/go/lib
        run: |
          rm -rf bindings/go/lib
          mkdir -p bindings/go/lib
          cp -r libs/* bindings/go/lib/
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bindings/go/lib
          if git diff --cached --quiet; then
            echo "no lib changes"
          else
            git commit -m "chore: bundle platform cdylibs into Go module [skip ci]"
            git push origin master
          fi