[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "temari"
version = "0.2.0"
description = "Apple Music FairPlay SAMPLE-AES sample decryption — ctypes bindings to the Temari cdylib (libtemari)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "WorldObservationLog" }]
keywords = ["decryption"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Security :: Cryptography",
]

[project.urls]
Homepage = "https://github.com/WorldObservationLog/Temari"
Repository = "https://github.com/WorldObservationLog/Temari"
Documentation = "https://github.com/WorldObservationLog/Temari"

[tool.setuptools]
packages = ["temari"]

[tool.setuptools.package-data]
temari = ["lib/*/*", "_src/*", "_src/src/*"]